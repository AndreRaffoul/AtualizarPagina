
<div class="form-container">
  <h1>Cadastro de Estoque</h1>
  <form id="supplier-form">
    <div class="form-group">
      <label for="produto">Produto</label>
      <input type="text" id="produto" name="produto" placeholder="Digite o Produto" required>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" formControlName="plussize" />
        Plus Size
      </label>
    </div>
    <div class="form-group">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="Digite o e-mail" required>
    </div>
    <div class="form-group">
      <label for="phone">Telefone:</label>
      <input type="tel" id="phone" name="phone" placeholder="Digite o telefone" required>
    </div>
    <div class="form-group">
      <label for="address">Endereço:</label>
      <input type="text" id="address" name="address" placeholder="Digite o endereço" required>
    </div>
    <div class="form-group">
      <label for="cnpj">CNPJ:</label>
      <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ" required>
    </div>
    <div class="form-group">
      <label for="category">Categoria:</label>
      <select id="category" name="category" required>
        <option value="">Selecione</option>
        <option value="alimentos">Alimentos</option>
        <option value="tecnologia">Tecnologia</option>
        <option value="vestuário">Vestuário</option>
        <option value="outros">Outros</option>
      </select>
    </div>
    <button type="submit">Cadastrar</button>
  </form>
</div>
