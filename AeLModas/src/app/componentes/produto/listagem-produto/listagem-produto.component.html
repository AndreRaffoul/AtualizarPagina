<div class="listagem-produto"> 
  <table mat-table  style="padding: 2%;" 
  [dataSource]="dataSource"> <!-- -->
    <ng-container matColumnDef="nomeProduto">
      <th mat-header-cell *matHeaderCellDef> Nome Produto </th>
      <!-- <td mat-cell *matCellDef="let element"> {{element.nomeProduto}} </td> -->
    </ng-container>
    
    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef> Preço </th>
      <!-- <td mat-cell *matCellDef="let element"> {{element.preco}} </td> -->
    </ng-container>

    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef> Quantidade </th>
      <!-- <td mat-cell *matCellDef="let element"> {{element.quantidade}} </td> -->
    </ng-container>

    <ng-container matColumnDef="editar">
      <th mat-header-cell *matHeaderCellDef> Editar </th>
      <td mat-cell *matCellDef="let element">
        <mat-icon style="font-size: 27px; color: rgb(0, 119, 255);"
           ><!--(click)="editarProduto(element.id)"-->
            edit_note
        </mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="deletar">
      <th mat-header-cell *matHeaderCellDef> Deletar </th>
      <td mat-cell *matCellDef="let element">
        <!--(click)="deletarProduto(element.id)"-->
        <mat-icon style="font-size: 27px; color: red;">delete</mat-icon>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
