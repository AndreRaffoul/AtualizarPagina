<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/produtos.css">
    <title>A&L Modas</title>
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <a href="css/index.html"><h1>A&L Modas</h1></a>
        </div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="signin.html">Login</a>
        </div>
    </nav>

    <header class="header">
        <div class="headline">
            <h2 style="font-size:60px">Cadastro de Fornecedores</h2>
            </div>
        <div class="img-headline">
            <img style="max-width: 50%;" src="img/banner2.png">
        </div>
    </header>

    
    <form id="supplier-form" (ngSubmit)="salvarFornecedor()" #eventForm="ngForm" >
      <div class="form-row">
        <!-- Criar campo de nome -->
        <div class="form-group">
          <label for="name">Nome:</label>
          <input type="text" id="name" name="name" placeholder="Digite o nome"
          [(ngModel)]="novoFornecedor.nomeFornecedor" required>
        </div>
        <!-- Criar campo de e-mail -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="Digite o e-mail" 
          [(ngModel)]="novoFornecedor.email" >
        </div>
      </div>
      <div class="form-row">
          <!-- Criar campo de endereço -->
          <div class="form-group">
            <label for="address">Endereço:</label>
            <input type="text" id="address" name="address" placeholder="Digite o endereço" 
            [(ngModel)]="novoFornecedor.endereco">
          </div>
        </div>
        <div class="form-row">
        <!-- Criar campo de telefone -->
        <div class="form-group">
          <label for="phone">Telefone:</label>
          <input type="tel" id="phone" name="phone" placeholder="Digite o telefone" 
          [(ngModel)]="novoFornecedor.telefone" >
        </div>
        <!-- Criar campo de CNPJ -->
        <div class="form-group">
          <label for="cnpj">CNPJ:</label>
          <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ" 
          [(ngModel)]="novoFornecedor.cnpj">
        </div>
        <!-- Criar campo de cidade -->
        <div class="form-group">
          <label for="city">Cidade:</label>
          <input type="text" id="city" name="city" placeholder="Digite a cidade" 
          [(ngModel)]="novoFornecedor.cidade">
        </div>
        <!-- Criar campo  CEP -->
        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" placeholder="Digite o CEP" 
          [(ngModel)]="novoFornecedor.cep">
        </div>
      </div>
      
      <!-- div que alinha os dois botões na horizontal no final da linha -->
      <div class="form-row form-buttons">
        <button type="submit">Atualizar : Salvar</button>
        <button type="button" *ngIf="editando" (click)="resetForm()" class="cancelar"
        >Cancelar</button>
      </div>
    </form>
  
    <div class="listagem-forme">
      <app-fornecedores-list (fornecedorSelecionado)="carregarFornecedorParaEdicao($event)"></app-fornecedores-list>
    </div>
  
  </div>
    
    <footer>
        <div class="logo-rodape">
            <h1 class="agencia">A&L Modas</h1>
            <p style="color:white">Sua loja de Roupas do Bairro</p>
        </div>
        <b style="color:white;">©2024 A&L Modas Todos os direitos reservados.</b>
    </footer>
</body>

</html>
