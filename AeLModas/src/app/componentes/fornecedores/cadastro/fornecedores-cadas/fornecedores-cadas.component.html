
  <div class="fornecedores-cadas">
    <h2>Cadastro de Fornecedores</h2>
    <form class="form-cadastro" (submit)="salvarFornecedor()">
      <!-- Criar campo de ID -->
      <div class="form-row">
        <!-- Criar campo de endereço -->
        <div class="form-group">
          <label for="name">Nome:</label>
          <input type="text" id="name" name="name" placeholder="Digite o nome"
          [(ngModel)]="novoFornecedor.nomeFornecedor" required>
        </div>
        <!-- Criar campo de e-mail -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="Digite o e-mail"
          [(ngModel)]="novoFornecedor.email" >
        </div>
      </div>

      <div class="form-row">
          <!-- Criar campo de endereço -->
          <div class="form-group">
            <label for="address">Endereço:</label>
            <input type="text" id="address" name="address" placeholder="Digite o endereço"
            [(ngModel)]="novoFornecedor.endereco">
          </div>
        </div>
        <div class="form-row">
        <!-- Criar campo de telefone -->
        <div class="form-group">
          <label for="phone">Telefone:</label>
          <input type="tel" id="phone" name="phone" placeholder="Digite o telefone"
          [(ngModel)]="novoFornecedor.telefone" >
        </div>
        <!-- Criar campo de CNPJ -->
        <div class="form-group">
          <label for="cnpj">CNPJ:</label>
          <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ"
          [(ngModel)]="novoFornecedor.cnpj">
        </div>
        <!-- Criar campo de cidade -->
        <div class="form-group">
          <label for="city">Cidade:</label>
          <input type="text" id="city" name="city" placeholder="Digite a cidade"
          [(ngModel)]="novoFornecedor.cidade">
        </div>
        <!-- Criar campo  CEP -->
        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" placeholder="Digite o CEP"
          [(ngModel)]="novoFornecedor.cep">
        </div>
      </div>

      <!-- div que alinha os dois botões na horizontal no final da linha -->
      <div class="form-row form-buttons">
        <button type="submit">Atualizar : Salvar</button>
        <button type="button" *ngIf="editando" (click)="resetForm()" class="cancelar"
        >Cancelar</button>
      </div>
    </form>

    <div class="listagem-forme">
      <app-fornecedores-list (fornecedorSelecionado)="carregarFornecedorParaEdicao($event)"></app-fornecedores-list>
    </div>

  </div>
