<body>
  <div class="container">
    <div class="header">
      <h1 class="text-primary">Fale Conosco</h1>
      <p class="text-muted">Entre em contato com a A&L Modas!</p>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="card p-4">
          <h3 class="text-secondary">Nossos Contatos</h3>
          <p><strong>Telefone:</strong> (21) 99999-9999</p>
          <p>
            <strong>WhatsApp:</strong>
            <a href="https://wa.me/5521999999999" target="_blank"
              >(21) 99999-9999</a
            >
          </p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4">
          <h3 class="text-secondary">Envie uma Mensagem</h3>
          <form>
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input
                type="text"
                class="form-control"
                id="nome"
                placeholder="Seu nome"
                required
              />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="seu@email.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem</label>
              <textarea
                class="form-control"
                id="mensagem"
                rows="4"
                placeholder="Escreva sua mensagem..."
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
