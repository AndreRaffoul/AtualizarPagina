<!-- Formulário de Cadastro -->
<div *ngIf="isSignUp" class="login-box">
  <h2>Cadastre-se</h2>

  <!-- Mensagem de erro ao tentar cadastro -->
  <p class="error-message" *ngIf="isSignUpFailed">Erro ao cadastrar. Tente novamente.</p>

  <!-- Mensagem de sucesso ao cadastrar -->
  <p class="success-message" *ngIf="isSignUpSuccessful">Cadastro realizado com sucesso!</p>

  <form (submit)="onSignUp()">
    <input type="text" placeholder="Nome Completo" [(ngModel)]="signUpData.name" name="name" required>
    <input type="email" placeholder="E-mail" [(ngModel)]="signUpData.email" name="email" required>
    <input type="password" placeholder="Senha" [(ngModel)]="signUpData.password" name="password" required>

    <button class="btn sign-up-btn" type="submit">Cadastrar</button>
  </form>

  <!-- Voltar para login -->
  <p><a href="#" (click)="toggleSignUp()">Voltar para Login</a></p>
</div>
